# Attribute claims checked by `nox -s docs_contract` (scripts/check_docs_contract.py).
#
# Every attribute the AI-facing docs promise is listed here and verified with
# `hasattr` (dataclass fields and __slots__ without defaults count too). When a
# doc page starts promising an attribute, add it here; remove an entry only
# together with the docs that mention it.

